services:
  - type: web
    name: chapel-hill-bestseller-finder
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PUBLIC_ORIGIN
        value: https://wayan.com
